# /etc/systemd/system/switch_ui_app.service.d/homeview.conf
# HomeView owns the screen; Brilliant's switch-ui keeps running OFFSCREEN so the
# cap-touch sliders, mesh switch and Brilliant backend behave exactly as before.
# Remove this file + `systemctl disable --now homeview` + daemon-reload to revert.
[Service]
Environment=QT_QPA_PLATFORM=offscreen
Environment=QT_QUICK_BACKEND=software
# Stock ExecStopPost paints a splash with fbi (which grabs the framebuffer).
ExecStopPost=
